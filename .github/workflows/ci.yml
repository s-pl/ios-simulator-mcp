name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  simulator:
    name: Real simulator (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install idb (optional, enables the UI tests)
        continue-on-error: true
        run: |
          brew tap facebook/fb
          brew trust facebook/fb
          brew install idb-companion
          pipx install fb-idb
      - name: Build the fixture app
        run: |
          app="$(bash test/fixtures/app/build.sh "$RUNNER_TEMP/fixture" | tail -n 1)"
          echo "FIXTURE_APP=$app" >> "$GITHUB_ENV"
      - run: npm run test:integration
      - name: Upload measurements and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-artifacts
          path: artifacts/
          if-no-files-found: ignore
